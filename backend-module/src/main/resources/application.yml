server:
  port: 8080

spring:
  config:
    import:
      - optional:classpath:.env[.properties]
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_URL}/ai_campus
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_URL}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms

      lettuce:
        pool:
          max-active: 8     # 最大连接数
          max-idle: 8       # 最大空闲连接
          min-idle: 0       # 最小空闲连接
          max-wait: -1ms    # 连接阻塞最大等待时间

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: is_deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 7200000
  refresh-token-expiration: 604800000

campus:
  ai:
    provider: qianfan  # 可切换值: deepseek / glm4 / qianfan / mock
    deepseek-api-key: ${DEEPSEEK_API_KEY:your-key-here}
    deepseek-base-url: https://api.deepseek.com
    deepseek-model: deepseek-chat
    glm-api-key: ${GLM_API_KEY:your-key-here}
    glm-base-url: https://open.bigmodel.cn/api/paas/v4
    glm-model: glm-4.7-flash
    qianfan-api-key: ${QIANFAN_API_KEY:your-key-here}
    qianfan-base-url: https://qianfan.baidubce.com/v2
    qianfan-model: ernie-speed-128k
    daily-limit: 50
    timeout-connect: 5000
    timeout-read: 30000
    max-retries: 2